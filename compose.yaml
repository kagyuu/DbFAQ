# DbFAQ — web(nginx)と api(FastAPI + MCP 子プロセス)。Oracle は含めない(既存のものに接続する)。ADR-012
name: dbfaq

services:
  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    # ports は書かない(ホストに公開しない)
    environment:
      DBFAQ_ORACLE_HOST: ${DBFAQ_ORACLE_HOST:-host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - dbfaq-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${DBFAQ_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  dbfaq-data: {}
