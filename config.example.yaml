# DbFAQ 設定ファイルのひな型。config.yaml にコピーして値を埋める(config.yaml は Git 管理外)。
oracle:
  host: localhost
  port: 1521
  service_name: FREEPDB1
  user: dbfaq_ro             # 読み取り専用ユーザー(作り方は README.md「Oracle に読み取り専用ユーザー dbfaq_ro を作る」)
  password: "change-me"
  schema: HR                 # 対象スキーマ(ER 図・PDB 情報・ひな型の対象)。省略時は user を大文字にしたもの
  query_timeout_sec: 30      # 1 回の問い合わせの上限(python-oracledb の call_timeout)
  connect_timeout_sec: 10
  pool_min: 1
  pool_max: 4
app:
  sqlite_path: ./data/dbfaq.sqlite3
  log_level: INFO
llm:                         # 自然言語から SQL を作る LLM(Ollama)。節ごと消すと LLM は使わない
  enabled: true
  provider: ollama           # いまは ollama だけ
  base_url: http://localhost:11434   # compose では環境変数 DBFAQ_LLM_BASE_URL で上書きする
  model: gemma4:e2b-it-qat
  timeout_sec: 180           # 1 回の作成で LLM の応答を待つ上限
  health_timeout_sec: 3      # 疎通確認の上限
  temperature: 0.0
  seed: 42
  num_ctx: 8192
  sample_rows: 3             # LLM に渡すデータの例の行数(0 で送らない)
  max_context_chars: 12000   # LLM に渡すスキーマの構造の上限(文字数)
