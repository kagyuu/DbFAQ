[project]
name = "dbfaq-server"
version = "0.5.0"
description = "DbFAQ backend (FastAPI)"
readme = "INDEX.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "oracledb>=26.0.0",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbfaq_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["oracle: 実 Oracle(HR)が必要なテスト"]

[tool.ruff]
line-length = 110

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
